# Fly.io: persistent 10 GB volume for the ~3.3 GB SQLite DB.
# First deploy: `fly launch --no-deploy` then `fly secrets set GH_TOKEN=…` and `fly deploy`.
# App name is filled in by `fly launch` if you omit --name.

app = "hrdf-explorer"
primary_region = "fra"
swap_size_mb = 2048

[build]
  dockerfile = "Dockerfile"

[deploy]
  wait_timeout = "15m"

[env]
  NODE_ENV = "production"
  HOSTNAME = "0.0.0.0"
  PORT = "8080"
  HRDF_DB = "/data/hrdf.sqlite"
  HRDF_ZIP = "/data/hrdf.zip"
  NEXT_TELEMETRY_DISABLED = "1"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0
  processes = ["app"]

  [http_service.concurrency]
    type = "requests"
    hard_limit = 50
    soft_limit = 25

  [[http_service.checks]]
    grace_period = "10m"
    interval = "30s"
    timeout = "5s"
    method = "GET"
    path = "/"

[mounts]
  source = "hrdf_data"
  destination = "/data"
  initial_size = "10gb"

[[vm]]
  size = "shared-cpu-1x"
  memory = "1024mb"
